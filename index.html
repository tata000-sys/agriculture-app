<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24734b">
  <link rel="manifest" href="./manifest.json">
  <title>農業管理アプリ</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font-family: sans-serif; background: #f2f7f1; color: #203328; }
    main { max-width: 700px; margin: auto; }
    h1 { color: #24734b; font-size: 26px; }
    .note { color: #52675a; font-size: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
    .card { background: white; padding: 16px; border-radius: 14px; box-shadow: 0 2px 8px #0000000c; }
    .label { font-size: 14px; color: #52675a; }
    .value { font-size: 27px; font-weight: bold; margin-top: 8px; }
    .status { font-weight: bold; margin-top: 8px; }
    label { display: block; margin: 18px 0 6px; }
    input, select, button { font: inherit; width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #c7d6c9; }
    button { background: #24734b; color: white; border: 0; margin-top: 16px; }
    @media (max-width: 380px) { body { padding: 12px; } .value { font-size: 23px; } }
  </style>
</head>
<body>
<main>
  <h1>🌱 農業管理アプリ</h1>
  <p class="note">農地の環境を確認する試作品</p>
  <p class="note">現在はデモ値です。実際のセンサーとは未接続です。</p>
  <div class="card">
  <h2>Firebase接続</h2>
  <label for="email">メールアドレス</label>
  <input id="email" type="email" autocomplete="username"
         placeholder="登録したメールアドレス">
  <label for="password">パスワード</label>
  <input id="password" type="password"
         autocomplete="current-password" placeholder="パスワード">
  <button id="loginButton" type="button">ログインして接続</button>
  <p id="connectionStatus" class="note">未接続</p>
</div>
  <label for="crop">作物</label>
  <select id="crop">
    <option value="野菜">野菜（仮設定）</option>
    <option value="トマト">トマト</option>
    <option value="イチゴ">イチゴ</option>
    <option value="稲">稲</option>
  </select>
  <section class="grid">
    <div class="card"><div class="label">土壌pH</div><div class="value" id="phValue">6.5</div><div class="status" id="phStatus">参考値</div></div>
    <div class="card"><div class="label">土壌水分</div><div class="value" id="moistureValue">45%</div><div class="status" id="moistureStatus">参考値</div></div>
    <div class="card"><div class="label">気温</div><div class="value" id="tempValue">25℃</div><div class="status" id="tempStatus">参考値</div></div>
    <div class="card"><div class="label">空気湿度</div><div class="value" id="humidityValue">60%</div><div class="status" id="humidityStatus">参考値</div></div>
  </section>
  <div class="card">
    <h2>デモ値を変更</h2><p class="note">スライダーを動かして警告表示を試せます。</p>
    <label for="ph">土壌pH：<span id="phLabel">6.5</span></label><input id="ph" type="range" min="3" max="9" step="0.1" value="6.5">
    <label for="moisture">土壌水分：<span id="moistureLabel">45</span>%</label><input id="moisture" type="range" min="0" max="100" value="45">
    <label for="temp">気温：<span id="tempLabel">25</span>℃</label><input id="temp" type="range" min="-5" max="45" value="25">
    <label for="humidity">空気湿度：<span id="humidityLabel">60</span>%</label><input id="humidity" type="range" min="0" max="100" value="60">
    <button id="reset">デモ値を初期状態に戻す</button>
  </div>
  <div class="card">
    <h2>農地へのアドバイス（試作）</h2><p id="advice">デモ値を確認しています。</p>
    <p class="note">水分の基準はセンサーや土質、作物によって異なります。pHだけでは栄養不足を断定できません。</p>
  </div>
</main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
  import {
    getDatabase,
    ref,
    onValue
  } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDPF8oyzQAHPmmmEw1VRrwl-J0D1NuHGcg",
    authDomain: "nogyouikusei.firebaseapp.com",
    databaseURL: "https://nogyouikusei-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nogyouikusei",
    storageBucket: "nogyouikusei.firebasestorage.app",
    messagingSenderId: "565792719066",
    appId: "1:565792719066:web:1fc696d70b7cae66e2e5e3",
    measurementId: "G-72CZJSLMJJ"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const database = getDatabase(app);

  const ids = ["ph", "moisture", "temp", "humidity"];
  const initial = { ph: 6.5, moisture: 45, temp: 25, humidity: 60 };

  function update() {
    const ph = Number(document.getElementById("ph").value);
    const moisture = Number(document.getElementById("moisture").value);
    const temp = Number(document.getElementById("temp").value);
    const humidity = Number(document.getElementById("humidity").value);

    document.getElementById("phValue").textContent = ph.toFixed(1);
    document.getElementById("moistureValue").textContent = moisture + "%";
    document.getElementById("tempValue").textContent = temp + "℃";
    document.getElementById("humidityValue").textContent = humidity + "%";

    document.getElementById("phLabel").textContent = ph.toFixed(1);
    document.getElementById("moistureLabel").textContent = moisture;
    document.getElementById("tempLabel").textContent = temp;
    document.getElementById("humidityLabel").textContent = humidity;

    document.getElementById("phStatus").textContent =
      ph < 5.5 ? "酸性寄り・要確認" : ph > 7 ? "アルカリ性寄り・要確認" : "仮の範囲内";

    document.getElementById("moistureStatus").textContent =
      moisture < 35 ? "乾燥の可能性" : "水分量を確認";

    document.getElementById("tempStatus").textContent =
      temp >= 35 ? "高温に注意" : temp <= 5 ? "低温に注意" : "気温を確認";

    document.getElementById("humidityStatus").textContent =
      humidity >= 85 ? "高湿度に注意" : "湿度を確認";

    const messages = [];
    if (moisture < 35) messages.push("土壌が乾燥している可能性があります。土の状態を確認してください。");
    if (ph < 5.5 || ph > 7) messages.push("pHが仮の目安から外れています。作物に合う基準を確認してください。");
    if (temp >= 35) messages.push("高温です。作物の様子と水分状態を確認してください。");
    if (humidity >= 85) messages.push("湿度が高めです。病害の兆候がないか確認してください。");

    document.getElementById("advice").textContent =
      messages.length ? messages.join(" ") : "大きな警告はありません。作物と土の状態も確認してください。";
  }

  ids.forEach(id => {
    document.getElementById(id).addEventListener("input", update);
  });

  document.getElementById("reset").addEventListener("click", () => {
    ids.forEach(id => {
      document.getElementById(id).value = initial[id];
    });
    update();
  });

  document.getElementById("loginButton").addEventListener("click", async () => {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const status = document.getElementById("connectionStatus");

    try {
      status.textContent = "ログイン中...";
      const result = await signInWithEmailAndPassword(auth, email, password);
      status.textContent = "ログイン成功。データを取得しています...";

      onValue(ref(database, "sensorData"), snapshot => {
        const data = snapshot.val();

        if (!data) {
          status.textContent = "ログイン済みですが、sensorDataが空です。";
          return;
        }

        if (data.ph != null) {
          document.getElementById("ph").value = data.ph;
        }
        if (data.moisture != null) {
          document.getElementById("moisture").value = data.moisture;
        }
        if (data.temperature != null) {
          document.getElementById("temp").value = data.temperature;
        } else if (data.temp != null) {
          document.getElementById("temp").value = data.temp;
        }
        if (data.humidity != null) {
          document.getElementById("humidity").value = data.humidity;
        }

        update();
        status.textContent = "Firebase接続中・データを受信しています";
      }, error => {
        status.textContent = "データ取得エラー: " + error.message;
      });

    } catch (error) {
      status.textContent = "ログインエラー: " + error.message;
    }
  });

  update();
</script>
</body>
</html>
